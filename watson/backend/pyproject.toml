[project]
name = "watson-backend"
version = "0.1.0"
description = "API do Watson: regras de negócio, agentes e acesso ao banco"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
db2 = ["ibm-db>=3.2", "ibm-db-sa>=0.4"]
watsonx = ["ibm-watsonx-ai>=1.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
