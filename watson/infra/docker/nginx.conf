server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API e rotas legadas permanecem na mesma origem do frontend. Isso preserva
    # o cookie HttpOnly/SameSite da sessão e evita depender de CORS no navegador.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /model-lab/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # React Router: caminhos de tela que não são arquivos caem no index.html.
    location / {
        try_files $uri /index.html;
    }
}
