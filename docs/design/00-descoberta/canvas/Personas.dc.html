<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Personas do Watson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&amp;family=IBM+Plex+Serif:ital,wght@1,300&amp;family=IBM+Plex+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f62fe}a:hover{color:#0043ce}
</style>
</helmet>
<div style="width: 1440px; height: 1040px; box-sizing: border-box; background: #ffffff; color: #161616; font-family: 'IBM Plex Sans', Arial, sans-serif; padding: 64px 80px; display: flex; flex-direction: column; gap: 40px">
  <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.32px; color: #525252">00 DESCOBERTA · PROTO-PERSONAS</p>
      <h1 style="margin: 0; font-size: 42px; line-height: 50px; font-weight: 300">Quem o Watson precisa servir</h1>
    </div>
    <p style="margin: 0; max-width: 420px; font-size: 14px; line-height: 20px; color: #525252">Duas pontas do mesmo fluxo: a analista decide no console, o associado confirma no app. Hipóteses a validar com Sponsor Users.</p>
  </header>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; flex-grow: 1">
    <sc-for list="{{personas}}" as="p" hint-placeholder-count="2">
      <article style="background: #f4f4f4; display: flex; flex-direction: column">
        <div style="display: flex; gap: 24px; padding: 32px 32px 24px">
          <svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="{{p.alt}}">
            <rect width="128" height="128" fill="{{p.tile}}"></rect>
            <path d="M20 128c0-26 19-42 44-42s44 16 44 42z" fill="{{p.shirt}}"></path>
            <rect x="55" y="70" width="18" height="20" fill="{{p.skin}}"></rect>
            <ellipse cx="64" cy="54" rx="21" ry="25" fill="{{p.skin}}"></ellipse>
            <path d="{{p.hair}}" fill="{{p.hairColor}}"></path>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 6px; justify-content: center">
            <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #0f62fe">{{p.tag}}</p>
            <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 400">{{p.name}}</h2>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: #525252">{{p.who}}</p>
          </div>
        </div>
        <blockquote style="margin: 0 32px 24px; font-family: 'IBM Plex Serif', Georgia, serif; font-style: italic; font-weight: 300; font-size: 22px; line-height: 30px">“{{p.quote}}”</blockquote>
        <dl style="margin: 0; display: flex; flex-direction: column; background: #ffffff; margin: 0 32px; flex-grow: 1">
          <sc-for list="{{p.rows}}" as="r" hint-placeholder-count="5">
            <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 16px; padding: 12px 16px; border-bottom: 1px solid #e0e0e0">
              <dt style="font-size: 12px; line-height: 16px; letter-spacing: 0.32px; font-weight: 600; color: #525252">{{r.k}}</dt>
              <dd style="margin: 0; font-size: 14px; line-height: 20px">{{r.v}}</dd>
            </div>
          </sc-for>
        </dl>
        <div style="padding: 20px 32px 32px; display: flex; flex-direction: column; gap: 8px">
          <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.32px; color: #525252">IMPLICAÇÕES DE DESIGN</p>
          <ul style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{p.impl}}" as="i" hint-placeholder-count="3"><li>{{i}}</li></sc-for>
          </ul>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      personas: [
        {
          tag: 'PERSONA 1 · CONSOLE', name: 'Camila Rocha', who: '31 anos · analista de prevenção a fraudes · 4 anos na área',
          alt: 'Retrato ilustrado de Camila', tile: '#d0e2ff', shirt: '#393939', skin: '#c99a74', hairColor: '#3e2723',
          hair: 'M42 58c-4-24 10-36 24-36 15 0 26 12 22 36l-4-14c-10 4-24 2-34-6-4 6-6 12-8 20z',
          quote: 'Não me dá só um número. Me mostra o que está estranho nessa compra.',
          rows: [
            { k: 'Objetivo', v: 'Decidir rápido e com segurança se um cartão suspeito deve ser bloqueado, sem travar quem compra de verdade.' },
            { k: 'Frustração', v: 'Centenas de alertas por turno, quase todos legítimos; score sem explicação; 4 a 5 sistemas por caso; justificativa escrita à mão.' },
            { k: 'Contexto', v: 'Minutos por alerta, SLA e meta de perda. Fraude concentrada em crédito, cartão não presente, rajadas e madrugada.' },
            { k: 'Sucesso', v: 'Fila por risco × valor, fatores explicados em uma tela, associado acionado com um clique, decisão registrada.' },
            { k: 'Relação', v: 'Uso diário e intenso. O agente recomenda, ela decide.' }
          ],
          impl: ['Tabela densa e ordenável, risco com cor e texto', 'Fatores de risco em linguagem de negócio', 'Justificativa gerada pelo agente e editável']
        },
        {
          tag: 'PERSONA 2 · APP', name: 'Valdir Bortolini', who: '58 anos · produtor rural (SC) · associado há 20 anos',
          alt: 'Retrato ilustrado de Valdir', tile: '#a7f0ba', shirt: '#525252', skin: '#e0b48f', hairColor: '#8d8d8d',
          hair: 'M43 50c0-16 10-24 21-24s21 8 21 24c-6-6-14-9-21-9s-15 3-21 9z',
          quote: 'Se for golpe, me avisa direito. E se fui eu, não me trava.',
          rows: [
            { k: 'Objetivo', v: 'Comprar sem susto e saber na hora se algo estranho aconteceu, sem ligar para ninguém.' },
            { k: 'Frustração', v: 'Cartão recusado numa compra grande de insumos; ligações que dizem ser do banco; mensagens com termos técnicos.' },
            { k: 'Contexto', v: 'Recebe o alerta a qualquer hora, muitas vezes no campo, com sinal fraco e pouca familiaridade digital.' },
            { k: 'Sucesso', v: 'Mensagem clara, resposta em um toque, confirmação de que o cartão está protegido.' },
            { k: 'Relação', v: 'Não vê o console: vive o Watson pelo alerta preventivo no app.' }
          ],
          impl: ['Valor, loja, cidade e hora antes da pergunta', 'Dois botões grandes, nenhum link externo', 'Sinal de confiança: nunca pedimos senha por telefone']
        }
      ]
    };
  }
}
</script>
</body>
</html>
