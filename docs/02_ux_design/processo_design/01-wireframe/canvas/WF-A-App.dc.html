<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Wireframe A · Alerta direto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#393939}a:hover{color:#161616}
.b{border:1px solid #8d8d8d;background:#fff;box-sizing:border-box}
.ph{background:#e0e0e0}
.l{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#525252;margin:0}
.ann{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#161616;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.btn{border:1px solid #393939;background:#fff;font:inherit;font-size:16px;min-height:56px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#161616}
.btn.p{background:#393939;color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f4f4; color: #161616; font-family: 'IBM Plex Sans', Arial, sans-serif; display: flex; flex-direction: column">
  <header class="b" style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-width: 0 0 1px 0">
    <div class="ph" style="width: 28px; height: 28px"></div>
    <p style="margin: 0; font-weight: 600">Cartões</p>
  </header>
  <main style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 8px; align-items: center"><span class="ann">1</span><p class="l">ALERTA APARECE AO ABRIR A NOTIFICAÇÃO</p></div>
    <section class="b" style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Compra suspeita no seu cartão final 4821</p>
      <dl style="margin: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #e0e0e0; padding-bottom: 8px">
            <dt style="font-size: 14px; color: #525252">{{r.k}}</dt>
            <dd style="margin: 0; font-size: 16px; font-weight: 600; text-align: right">{{r.v}}</dd>
          </div>
        </sc-for>
      </dl>
    </section>
    <div style="display: flex; gap: 8px; align-items: center"><span class="ann">2</span><p style="margin: 0; font-size: 20px; font-weight: 600">Foi você?</p></div>
    <a class="btn p" href="#">Sim, fui eu</a>
    <a class="btn" href="#">Não reconheço · bloquear cartão</a>
    <div style="flex-grow: 1"></div>
    <div class="b" style="padding: 14px; display: flex; gap: 10px; align-items: flex-start">
      <span class="ann">3</span>
      <p style="margin: 0; font-size: 14px; line-height: 20px">Nunca pedimos senha ou código por telefone. Responda só por aqui.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { k: 'Valor', v: 'R$ 2.480,00' },
        { k: 'Loja', v: 'Loja online (fictícia)' },
        { k: 'Cidade', v: 'São Paulo, SP' },
        { k: 'Quando', v: 'Hoje, 03:14' }
      ]
    };
  }
}
</script>
</body>
</html>
